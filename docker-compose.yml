# ─────────────────────────────────────────────────────────────────────────
# docker-compose.yml — Pipeline TC (RAG / FastAPI Architecture)
# ─────────────────────────────────────────────────────────────────────────
version: "3.8"

services:
  # ── API FastAPI ──────────────────────────────────────────────────────
  api:
    build: .
    container_name: tc-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data                        # Datos unificados y ChromaDB persistente
      - ./tc_pipeline:/app/tc_pipeline          # Hot-reload para desarrollo del backend
      - ./scripts:/app/scripts
    environment:
      - PYTHONPATH=/app
      - LOG_LEVEL=INFO
    command: >
      uvicorn tc_pipeline.api.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; r = requests.get('http://localhost:8000/api/v1/health'); r.raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3

# ── Worker de Embeddings / Pipeline RAG ──────────────────────────────
  worker:
    build: .
    container_name: tc-worker
    volumes:
      - ./data:/app/data
      - ./tc_pipeline:/app/tc_pipeline
      - ./src:/app/src
      - ./scripts:/app/scripts
    environment:
      - PYTHONPATH=/app
      - LOG_LEVEL=INFO
    # LLAMA AL ORQUESTADOR ETL PRINCIPAL DE TU EQUIPO
    command: ["python", "src/indexing/chroma_pipeline.py"]
    profiles:
      - worker
    restart: "no"