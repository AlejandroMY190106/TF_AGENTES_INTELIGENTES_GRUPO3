# ─────────────────────────────────────────────────────────────────────────
# docker-compose.yml — Pipeline TC (RAG / FastAPI Architecture)
# ─────────────────────────────────────────────────────────────────────────
version: "3.8"

services:
  # ── API FastAPI ──────────────────────────────────────────────────────
  api:
    build: .
    container_name: tc-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data                        # Datos unificados y ChromaDB persistente
      - ./tc_pipeline:/app/tc_pipeline          # Hot-reload para desarrollo del backend
      - ./scripts:/app/scripts
    environment:
      - PYTHONPATH=/app
      - LOG_LEVEL=INFO
    command: >
      uvicorn tc_pipeline.api.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; r = requests.get('http://localhost:8000/api/v1/health'); r.raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Worker de Embeddings / Pipeline RAG ──────────────────────────────
  worker:
    build: .
    container_name: tc-worker
    volumes:
      - ./data:/app/data
      - ./tc_pipeline:/app/tc_pipeline
      - ./scripts:/app/scripts
    environment:
      - PYTHONPATH=/app
      - LOG_LEVEL=INFO
    # Comando actualizado para llamar al nuevo pipeline unificado de embeddings
    command: >
      python scripts/process_embeddings.py 
      --input data/raw/expedientes_tc.parquet
      --output-chunks data/raw/chunks.jsonl
      --output-embeddings data/raw/embeddings.jsonl
    profiles:
      - worker  # Solo se activa de manera explícita con --profile worker
    restart: "no"